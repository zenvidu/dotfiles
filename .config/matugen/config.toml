[config]
version_check = false
#fallback_color = "#228B22"
#prefer = "closest-to-fallback"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/matugen/generated/hypr-matugen.lua'
post_hook = 'hyprctl reload'
