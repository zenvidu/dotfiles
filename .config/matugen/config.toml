[templates.folder]
input_path = '~/.config/matugen/templates/folder-color.txt'
output_path = '~/.config/matugen/papirus-folders/folder-color.txt'
post_hook   = '''
bash -c '
{
  $HOME/.config/matugen/papirus-folders/change-icons.sh
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.vscode-raw]
input_path = '~/.config/matugen/templates/vscode-colors'
output_path = '~/.config/matugen/generated/vscode-colors'
post_hook   = '''
bash -c '
{
  mkdir -p "$HOME/.cache/matugen"
  ln -nfs "$HOME/.config/matugen/generated/vscode-colors" "$HOME/.cache/matugen/vscode-colors"
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.config/matugen/generated/vscode-colors.json'
post_hook   = '''
bash -c '
{
  mkdir -p "$HOME/.cache/matugen"
  ln -nfs "$HOME/.config/matugen/generated/vscode-colors.json" "$HOME/.cache/matugen/vscode-colors.json"
} >/dev/null 2>&1 </dev/null & disown
'
'''
