#bash -c '
#{
#  mkdir -p "$HOME/.config/hypr/config/colors"
#  ln -nfs "$HOME/.config/matugen/generated/hypr-matugen.lua" "$HOME/.config/hypr/config/colors/hypr-matugen.lua"
#  hyprctl reload
#} >/dev/null 2>&1 </dev/null & disown
#'
#'''

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/matugen/generated/hypr-matugen.conf'

[templates.css]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/colors.css'
post_hook   = '''
bash -c '
{
  pkill -SIGUSR2 waybar
  killall swayosd-server; swayosd-server &
} >/dev/null 2>&1 </dev/null & disown
'
'''

