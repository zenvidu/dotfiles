[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/matugen/generated/rofi-matugen.rasi'

#[templates.starship]
#input_path = '~/.config/matugen/templates/starship-colors.toml'
#output_path = '~/.config/matugen/generated/starship-matugen.toml'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/matugen/generated/kitty-matugen.conf'
post_hook   = '''
bash -c '
{
  ln -nfs "$HOME/.config/matugen/generated/kitty-matugen.conf" "$HOME/.config/kitty/kitty-matugen.conf"
  pkill -SIGUSR1 kitty
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.yazi]
input_path  = '~/.config/matugen/templates/yazi-colors.toml'
output_path = '~/.config/matugen/generated/yazi-matugen.toml'
post_hook   = '''
ln -nfs "$HOME/.config/matugen/generated/yazi-matugen.toml" "$HOME/.config/yazi/theme.toml"
'''

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/matugen/generated/cava-matugen.ini'
post_hook   = '''
bash -c '
{
  mkdir -p "$HOME/.config/cava/themes"
  ln -nfs "$HOME/.config/matugen/generated/cava-matugen.ini" "$HOME/.config/cava/themes/cava-matugen.ini"
  pkill -USR1 cava
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.rmpc]
input_path = '~/.config/matugen/templates/rmpc-matugen.ron'
output_path = '~/.config/matugen/generated/rmpc-matugen.ron'
post_hook   = '''
bash -c '
{
  mkdir -p "$HOME/.config/rmpc/themes"
  ln -nfs "$HOME/.config/matugen/generated/rmpc-matugen.ron" "$HOME/.config/rmpc/themes/rmpc-matugen.ron"
} >/dev/null 2>&1 </dev/null & disown
'
'''

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/matugen/generated/btop-matugen.theme'
post_hook = 'pkill -SIGUSR2 btop || true'

