# Hyprlock Configuration
source = ~/.config/matugen/generated/hypr-matugen.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/wallvas/cwall
    blur_passes = 2
    blur_size = 3
    brightness = .6
}

# Greeting
label {
    monitor =
    text = <i>Welcome back, Buddy</i>
    color = $primary
    font_size = 18
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 4
    shadow_size = 1
    position = 40, -20
    halign = left
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"<b>%H</b>"
    color = $primary
    font_size = 130
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 3
    shadow_size = 1
    position = -70, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"<b>%M</b>"
    color = rgba(150,150,150, 0.4)
    font_size = 130
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 3
    shadow_size = 1
    position = 70, 80
    halign = center
    valign = center
}

#Date
label {
    monitor =
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $primary
    font_size = 18
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 4
    shadow_size = 1
    position = -40,-20
    halign = right
    valign = top
}

label {
  monitor =
  text = cmd[update:1000] echo "<i></i> $(~/.config/scripts/nowplaying_once.sh)"
  color = rgba(150,150,150, 0.4)
  font_size = 18
  font_family = CodeNewRoman Nerd Font Propo
  position = 0, 20
  halign = center
  valign = bottom
}

# Password Input Field
input-field {
    monitor =
    size = 7%, 4%
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(256, 256, 256, 0.0)
    inner_color = rgba(256, 256, 256, 0.0)
    font_color = $primary
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text =
    hide_input = false
    rounding = 20
    check_color = $on_surface_variant
    fail_color = $error
    #fail_text = Access denied
    fail_text = <b>LOGIN REJECTED</b>
    fail_timeout = 300
    capslock_color = $secondary
    numlock_color = $secondary
    bothlock_color = $secondary
    invert_numlock = true
    swap_font_color = true
    position = 0, -100
    halign = center
    valign = center
}
