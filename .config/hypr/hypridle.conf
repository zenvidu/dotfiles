# see https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprlock
    #after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 180  # 3min.
    on-timeout = ~/.config/scripts/brightness/ddc-dim.sh
    on-resume = ~/.config/scripts/brightness/ddc-restore.sh
}

listener {
    timeout = 600 # 10mins
    on-timeout = loginctl lock-session
    on-resume = ~/.config/scripts/brightness/ddc-restore.sh
}

listener {
    timeout = 900 # 15mins
    #on-timeout = hyprctl dispatch dpms off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    #on-resume = hyprctl dispatch dpms on && ~/.config/scripts/brightness/ddc-restore.sh
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ~/.config/scripts/brightness/ddc-restore.sh
}
